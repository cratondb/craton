[package]
name = "kimberlite-cluster"
description = "Multi-node cluster orchestration for Kimberlite (not ready for public use)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
toml = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["process", "signal", "sync", "time"] }

# Backup/restore — `backup` module tars+zstd's a node data dir.
tar = { workspace = true }
zstd = { workspace = true }
blake3 = { workspace = true }

# Kimberlite dependencies
kimberlite-types = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Integration test (`tests/three_node_smoke.rs`) connects to spawned
# nodes via the wire protocol and writes/reads a real event.
kimberlite-client = { workspace = true }

[package.metadata.cargo-machete]
# Used in node management and error handling (stub implementation)
ignored = ["anyhow", "kimberlite-types"]
