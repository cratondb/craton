# Deploy Kimberlite Marketing Website to AWS
#
# Triggers:
# - Push to main when website/** changes
# - Manual workflow_dispatch
#
# Prerequisites (one-time AWS setup):
# 1. Create IAM OIDC identity provider for GitHub
# 2. Create IAM role `github-actions-kimberlite` with trust policy for this repo

name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployment stage"
        required: true
        default: "production"
        type: choice
        options:
          - dev
          - production

permissions:
  id-token: write # Required for OIDC authentication
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-kimberlite
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Determine stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ inputs.stage }}" >> $GITHUB_OUTPUT
          else
            echo "stage=production" >> $GITHUB_OUTPUT
          fi

      - name: Copy docs into website build context
        # The Dockerfile (website/Dockerfile) does COPY docs ./docs.
        # The build context is ./website, so docs/ must be present inside it.
        run: cp -r docs website/docs

      - name: Resolve latest Kimberlite release tag
        id: latest
        # Templates the "Latest Release: vX.Y.Z" string on the home page
        # from the GitHub Releases API instead of the previous hard-
        # coded-per-release manual edit. Falls back to the workspace
        # Cargo.toml version (via build.rs) when the API is unreachable.
        # ROADMAP v0.5.0 "Docker mirror + install.sh templating".
        run: |
          tag=$(curl -fsSL "https://api.github.com/repos/kimberlitedb/kimberlite/releases/latest" \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"//;s/".*//' || true)
          if [ -z "$tag" ]; then
            tag="unknown"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved latest release tag: $tag"

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./website
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/kmb-site-${{ steps.stage.outputs.stage }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/kmb-site-${{ steps.stage.outputs.stage }}:latest
          build-args: |
            KIMBERLITE_LATEST_RELEASE=${{ steps.latest.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Deploy with SST
        working-directory: website
        run: npx sst deploy --stage ${{ steps.stage.outputs.stage }}

      - name: Force App Runner deployment
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='kmb-site-${{ steps.stage.outputs.stage }}'].ServiceArn" --output text)
          echo "Triggering deployment for: $SERVICE_ARN"
          aws apprunner start-deployment --service-arn "$SERVICE_ARN"

          # Wait for deployment to complete (10-minute timeout, 60 polls x 10s).
          echo "Waiting for deployment to complete..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; then
              echo "ERROR: Timed out after $((MAX_ATTEMPTS * 10))s waiting for App Runner deployment"
              exit 1
            fi
            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — Status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment complete!"
              break
            elif [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
              sleep 10
            else
              echo "Unexpected status: $STATUS"
              exit 1
            fi
          done

      - name: Output deployment URL
        run: |
          echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Stage: \`${{ steps.stage.outputs.stage }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
