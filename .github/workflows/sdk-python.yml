name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - 'crates/kimberlite-ffi/**'
      - '.github/workflows/sdk-python.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - 'crates/kimberlite-ffi/**'
      - '.github/workflows/sdk-python.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd sdks/python
          pip install -r requirements-dev.txt || pip install pytest mypy build

      - name: Build FFI library
        run: cargo build --release -p kimberlite-ffi

      - name: Run unit tests
        run: |
          cd sdks/python
          pytest tests/test_value.py tests/test_query.py -v

      - name: Type check with mypy
        run: |
          cd sdks/python
          mypy kimberlite --strict || true

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build FFI library (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo build --release -p kimberlite-ffi

      - name: Build FFI library (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p kimberlite-ffi
        shell: bash

      - name: Build wheel (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd sdks/python
          chmod +x build_wheel.sh
          ./build_wheel.sh

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          cd sdks/python
          bash build_wheel.sh
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: sdks/python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [test, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: pypi
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install twine
        run: pip install twine

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Mask the PyPI token so it does not appear in CI logs.
          echo "::add-mask::$TWINE_PASSWORD"
          # --verbose surfaces the full PyPI response body; prior
          # v0.5.0 / v0.5.1 runs showed only "HTTPError: 400 Bad
          # Request" with no context. Also --skip-existing so a
          # partial-upload rerun no-ops the already-published wheels
          # instead of erroring.
          twine upload --verbose --skip-existing dist/*
